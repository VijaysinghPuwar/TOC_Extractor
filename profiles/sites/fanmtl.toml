# fanmtl.com
#
# The novel page carries the whole list, 100 links to a page.
#
# h2, not h1: h1 is the book's name and is the same on every chapter page,
# so every chapter would be saved under one filename.
#
# Selectors surveyed against the live site on 2026-09-27 and checked by
# actually extracting chapters with them. Sites redesign, so treat a profile
# that stops working as a survey to redo, not a bug.
#
#   python -m toc_extractor --profile profiles/sites/fanmtl.toml --toc https://www.fanmtl.com/novel/6982351.html
#
# Use only on content you own or are permitted to access.

[selectors]
link = "#chpagedlist ul.chapter-list li a"
title = "h2"
content = ".chapter-content"

[options]
min_delay = 2.0
max_delay = 4.0
concurrency = 2
