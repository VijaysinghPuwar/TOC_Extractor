# ranobes.top
#
# The contents live at /chapters/<id>/, not on the novel page, and
# are paged 25 at a time.
#
# Selectors surveyed against the live site on 2026-09-27 and checked by
# actually extracting chapters with them. Sites redesign, so treat a profile
# that stops working as a survey to redo, not a bug.
#
#   python -m toc_extractor --profile profiles/sites/ranobes.toml --toc https://ranobes.top/chapters/1205249/
#
# Use only on content you own or are permitted to access.

[selectors]
link = ".cat_line a"
title = "h1"
content = "#arrticle"

[options]
min_delay = 2.0
max_delay = 4.0
concurrency = 2
