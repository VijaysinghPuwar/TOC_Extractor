name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run has nothing to tell anyone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version developed against. Used wherever a single version is enough.
  PRIMARY_PYTHON: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test_readme.py checks that the v1.0.0 tag still resolves, and a
          # default checkout fetches no tags.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
      - run: make deps
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test_readme.py checks that the v1.0.0 tag still resolves, and a
          # default checkout fetches no tags.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
      - run: make deps
      - run: make typecheck

  test:
    # No browser and no network: the fixture server is local and the page
    # source is a stub, so these jobs never download Chromium.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test_readme.py checks that the v1.0.0 tag still resolves, and a
          # default checkout fetches no tags.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: make deps
      - name: Confirm the GUI bridge and worker import without Tk
        # The invariant is that these two modules never import Tk, so the GUI
        # state machine stays testable without a display. Asserting the runner
        # has no _tkinter tested the runner instead, and broke the day the
        # images started shipping it - which is also why it could never run
        # meaningfully on a developer machine that has Tk. Blocking the import
        # tests the actual rule, anywhere.
        run: |
          .venv/bin/python -c "
          import sys
          sys.modules['tkinter'] = None
          try:
              import tkinter
          except ImportError:
              pass
          else:
              raise SystemExit('could not make tkinter unimportable')
          import toc_extractor.gui.bridge, toc_extractor.gui.worker
          print('gui.bridge and gui.worker import with tkinter unavailable')
          "
      - run: make test-fast

  dotnet:
    # The C# implementation. Pinned by global.json so a runner image bump
    # cannot quietly change the SDK the build was verified against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test_readme.py checks that the v1.0.0 tag still resolves, and a
          # default checkout fetches no tags.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore dotnet/TocExtractor.slnx
      - run: dotnet build dotnet/TocExtractor.slnx --no-restore
      - name: Formatting
        run: dotnet format dotnet/TocExtractor.slnx --verify-no-changes --no-restore
      - name: Core tests
        run: dotnet test dotnet/tests/TocExtractor.Core.Tests --no-build
      - name: CLI tests
        run: dotnet test dotnet/tests/TocExtractor.Cli.Tests --no-build

  dotnet-browser:
    # One job, because Chromium is the only thing this downloads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test_readme.py checks that the v1.0.0 tag still resolves, and a
          # default checkout fetches no tags.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build dotnet/tests/TocExtractor.Browser.Tests
      - name: Cache the browser build
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-dotnet-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props') }}
      - name: Install Chromium
        working-directory: dotnet/tests/TocExtractor.Browser.Tests/bin/Debug/net10.0
        run: ./.playwright/node/linux-x64/node ./.playwright/package/cli.js install --with-deps chromium
      - run: dotnet test dotnet/tests/TocExtractor.Browser.Tests --no-build

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test_readme.py checks that the v1.0.0 tag still resolves, and a
          # default checkout fetches no tags.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
      - run: make deps
      - run: make test-fast

  browser:
    # One job, because Chromium is the only thing CI downloads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test_readme.py checks that the v1.0.0 tag still resolves, and a
          # default checkout fetches no tags.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
      - run: make deps

      - name: Resolve the browser build
        id: browser
        # Keyed on the build Playwright actually resolves, not on a lockfile
        # hash: the hash changes for unrelated dependency bumps and misses a
        # browser change that comes from the same pinned Playwright range.
        # Extracted in Python rather than sed: \+ is a GNU extension, so a sed
        # one-liner works on the Linux runner and silently matches nothing
        # anywhere else - and a cache key that quietly resolves to empty is a
        # permanent cache miss nobody notices.
        run: |
          .venv/bin/python -c "
          import re, subprocess, os
          out = subprocess.run(
              ['.venv/bin/python', '-m', 'playwright', 'install', '--dry-run', 'chromium'],
              capture_output=True, text=True, check=True).stdout
          match = re.search(r'chromium-(\d+)', out)
          if not match:
              raise SystemExit('could not resolve the chromium build from:\n' + out)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'build={match.group(1)}\n')
          print('resolved chromium-' + match.group(1))
          "

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.browser.outputs.build }}

      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make test-browser
