name: Release

# Push a tag like v2.1.0 to build the desktop app for macOS and Windows,
# check each build starts, and attach a .dmg for each Mac and a setup .exe
# for Windows to a GitHub release. Run it by hand with a tag to rebuild the
# installers of a release that already exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the installers to, e.g. v2.5.0"
        required: true

permissions:
  contents: write

jobs:
  macos:
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Rosetta, to self-test the Intel build
        if: matrix.rid == 'osx-x64'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - run: packaging/macos/make-app.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.rid }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: pwsh packaging/windows/make-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: app-win-x64
          path: dist/*-setup.exe

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          notes="packaging/release-notes.md"
          files=(dist/*.dmg dist/*-setup.exe)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            # Earlier releases carried zips; the installers replace them.
            gh release view "$tag" --json assets -q '.assets[].name' | grep '\.zip$' \
              | while read -r old; do gh release delete-asset "$tag" "$old" --yes; done
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" "${files[@]}" --title "${tag#v}" --notes-file "$notes"
          fi
