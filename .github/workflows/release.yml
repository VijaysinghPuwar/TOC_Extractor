name: Release

# Push a tag like v2.1.0 to build the desktop app for macOS and Windows,
# check each build starts, and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Rosetta, to self-test the Intel build
        if: matrix.rid == 'osx-x64'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - run: packaging/macos/make-app.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.rid }}
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh packaging/windows/make-zip.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: app-win-x64
          path: dist/*.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="packaging/release-notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.zip --title "${tag#v}" --notes-file "$notes"
          fi
