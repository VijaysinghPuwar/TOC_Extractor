<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" role="img" aria-label="How it works: paste the page, scan, choose, save">
  <rect x="10" y="20" width="180" height="150" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="100" cy="52" r="15" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="100" y="58" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000">1</text>
  <text x="100" y="102" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#000000">Paste the page</text>
  <text x="100" y="128" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">The novel's page,</text>
  <text x="100" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">nothing else</text>
  <g stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="196" y1="95" x2="224" y2="95"/><path d="M217 89 L224 95 L217 101"/></g>
  <rect x="230" y="20" width="180" height="150" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="320" cy="52" r="15" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="320" y="58" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000">2</text>
  <text x="320" y="102" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#000000">Scan</text>
  <text x="320" y="128" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">It finds the chapters</text>
  <text x="320" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">and the story text</text>
  <g stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="416" y1="95" x2="444" y2="95"/><path d="M437 89 L444 95 L437 101"/></g>
  <rect x="450" y="20" width="180" height="150" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="540" cy="52" r="15" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="540" y="58" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000">3</text>
  <text x="540" y="102" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#000000">Choose</text>
  <text x="540" y="128" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">Pick the chapters,</text>
  <text x="540" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">for example 350 to 400</text>
  <g stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="636" y1="95" x2="664" y2="95"/><path d="M657 89 L664 95 L657 101"/></g>
  <rect x="670" y="20" width="180" height="150" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="760" cy="52" r="15" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="760" y="58" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000">4</text>
  <text x="760" y="102" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#000000">Save</text>
  <text x="760" y="128" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">One TXT or PDF,</text>
  <text x="760" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">in reading order</text>
</svg>
