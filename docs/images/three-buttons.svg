<svg xmlns="http://www.w3.org/2000/svg" width="760" height="104" viewBox="0 0 760 104" role="img" aria-label="The three buttons: Launch browser, I'm Ready, Start extraction">
  <rect x="10" y="14" width="220" height="46" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="120" y="43" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000">1. Launch browser</text>
  <text x="120" y="88" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">A browser window opens</text>
  <g stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="236" y1="37" x2="264" y2="37"/><path d="M257 31 L264 37 L257 43"/></g>
  <rect x="270" y="14" width="220" height="46" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="380" y="43" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000">2. I'm Ready</text>
  <text x="380" y="88" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">After you sign in, if needed</text>
  <g stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="496" y1="37" x2="524" y2="37"/><path d="M517 31 L524 37 L517 43"/></g>
  <rect x="530" y="14" width="220" height="46" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="640" y="43" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000">3. Start extraction</text>
  <text x="640" y="88" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#000000">Chapters start saving</text>
</svg>
